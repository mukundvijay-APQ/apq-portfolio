        const generateRecommendations = (formData) => {
            const recommendations = [];
            
            // Extract numeric values from form
            const qualityText = formData.qualityIssues?.toLowerCase() || '';
            const testText = formData.testResults?.toLowerCase() || '';
            
            // Try to extract yield from test results
            const yieldMatch = testText.match(/yield[:\s]+(\d+(?:\.\d+)?)/i);
            const cpkMatch = testText.match(/cpk[:\s]+(\d+(?:\.\d+)?)/i);
            const dpmoMatch = testText.match(/dpmo[:\s]+(\d+)/i);
            
            if (yieldMatch && parseFloat(yieldMatch[1]) < 95) {
                recommendations.push({
                    type: 'warning',
                    title: 'Low First Pass Yield Detected',
                    message: `Yield of ${yieldMatch[1]}% is below industry standard (95%). Recommend root cause analysis.`,
                    action: 'Initiate 8D investigation on top 3 defect types'
                });
            }
            
            if (cpkMatch && parseFloat(cpkMatch[1]) < 1.33) {
                recommendations.push({
                    type: 'critical',
                    title: 'Process Not Capable',
                    message: `Cpk of ${cpkMatch[1]} indicates process is not capable. Target: >1.33 for production.`,
                    action: 'Implement SPC monitoring and reduce process variation'
                });
            }
            
            if (dpmoMatch && parseInt(dpmoMatch[1]) > 1000) {
                recommendations.push({
                    type: 'warning',
                    title: 'High Defect Density',
                    message: `DPMO of ${dpmoMatch[1]} indicates quality issues. Target: <500 DPMO.`,
                    action: 'Conduct Pareto analysis to identify vital few defects'
                });
            }
            
            // Look for keywords indicating issues
            if (qualityText.includes('failure') || qualityText.includes('defect')) {
                if (formData.phase === 'EVT') {
                    recommendations.push({
                        type: 'info',
                        title: 'EVT Phase - Early Detection',
                        message: 'Issues found in EVT are 10x cheaper to fix than in DVT. Focus on design validation.',
                        action: 'Schedule design FMEA review with cross-functional team'

                        type: 'critical',
                        title: 'DVT Gate Risk',
                        message: 'Multiple quality issues detected in DVT. Gate transition may be at risk.',
                        action: 'Create recovery plan with clear exit criteria and timeline'
                    });
                }

            // Generic helpful tip if no issues detected

                    type: 'info',
                    title: 'Quality Data Entry Tips',
                    message: 'Include specific metrics (Yield %, Cpk, DPMO) in your test results for detailed recommendations.',
                    action: 'Add quantitative data to receive targeted quality insights'
                });
            }
            
            return recommendations;

        // Enhanced Pareto Chart Component
        function ParetoChart({ data }) {
          const items = (data && data.top3Issues) || [];
          const chartRef = useRef(null);
          const chartInstance = useRef(null);
          
          useEffect(() => {
            if (chartRef.current && items.length > 0) {
              const ctx = chartRef.current.getContext('2d');
              
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
              
              const percentages = items.map(item => parseInt(item.percentage));
              const cumulative = items.map(item => parseInt(item.cumulativePercentage));
              
              chartInstance.current = new Chart(ctx, {
                type: 'bar',
                data: {
                  labels: items.map((item) => item.issue),
                  datasets: [{
                    label: 'Defect %',
                    data: percentages,
                    backgroundColor: 'rgba(15, 118, 110, 0.8)',
                    borderColor: '#0f766e',
                    borderWidth: 2,
                    yAxisID: 'y'
                  }, {
                    label: 'Cumulative %',
                    data: cumulative,
                    type: 'line',
                    borderColor: '#b45309',
                    backgroundColor: 'rgba(180, 83, 9, 0.06)',
                    borderWidth: 3,
                    fill: true,
                    yAxisID: 'y1',
                    tension: 0.4
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: {
                      labels: { color: '#0f172a', font: { size: 12 } }
                    },
                    title: {
                      display: false
                    }
                  },
                  scales: {
                    y: {
                      type: 'linear',
                      position: 'left',
                      ticks: { color: '#64748b' },
                      grid: { color: 'rgba(100, 116, 139, 0.15)' },
                      title: { display: true, text: 'Defect %', color: '#0f766e' }
                    },
                    y1: {
                      type: 'linear',
                      position: 'right',
                      ticks: { color: '#64748b' },
                      grid: { display: false },
                      title: { display: true, text: 'Cumulative %', color: '#b45309' },
                      max: 100
                    },
                    x: {
                      ticks: { color: '#64748b' },
                      grid: { color: 'rgba(100, 116, 139, 0.15)' }
                    }
                  }
                }
              });
            }
            
            return () => {
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
            };
          }, [data]);
          
          if (items.length === 0) {
            return (
              <div style={{ padding: '2.5rem 1rem', textAlign: 'center', color: '#64748b', background: '#f8fafc', borderRadius: '0.5rem', border: '1px dashed #e2e8f0' }}>

            const a = document.createElement('a');
            a.href = url;

        // Control Chart Component with Western Electric Rules Detection
        function ControlChart({ series }) {
          const chartRef = useRef(null);
          const chartInstance = useRef(null);
          const [violations, setViolations] = useState([]);
          const _custom = !!(series && series.length >= 5);
          
          useEffect(() => {
            // Generate data with ACTUAL 8 consecutive points below CL
            const dataPoints = [
              85,  // 1: above
              82,  // 2: below
              88,  // 3: above (peak)
              82,  // 4: below - START OF RUN
              81,  // 5: below
              79,  // 6: below
              80,  // 7: below
              83,  // 8: below
              82,  // 9: below
              81,  // 10: below
              83,  // 11: below - END (8 consecutive: samples 4-11)
              87,  // 12: above (breaks run)
              85,  // 13: above
              84,  // 14: at CL
              86,  // 15: above
              83,  // 16: below
              85,  // 17: above
              87,  // 18: above
              84,  // 19: at CL
              85   // 20: above
            ];
            const plotData = _custom ? series : dataPoints;
            const mean = _custom ? series.reduce((a, b) => a + b, 0) / series.length : 84;
            const _sd = _custom ? Math.sqrt(series.reduce((a, b) => a + (b - mean) * (b - mean), 0) / series.length) : 4;
            const ucl = _custom ? mean + 3 * _sd : 90;
            const lcl = _custom ? mean - 3 * _sd : 78;
            
            // Detect Rule 4: 8+ consecutive on one side of CL
            const detectRule4 = (data, CL) => {
              let consecutiveBelow = 0;
              let startBelow = -1;
              
              for (let i = 0; i < data.length; i++) {
                if (data[i] < CL) {
                  if (consecutiveBelow === 0) startBelow = i;
                  consecutiveBelow++;
                  if (consecutiveBelow >= 8) {
                    return { 
                      found: true, 
                      side: 'below', 
                      start: startBelow, 
                      end: i,
                      count: consecutiveBelow 
                    };
                  }
                } else if (data[i] > CL) {
                  consecutiveBelow = 0;
                } else {
                  consecutiveBelow = 0;
                }
              }
              return { found: false };
            };
            
            // Run detection
            const rule4Result = detectRule4(plotData, mean);
            if (rule4Result.found) {
              setViolations([{
                message: `OUT OF CONTROL${_custom ? '' : ' at Station 3'}: ${rule4Result.count} consecutive points ${rule4Result.side} centerline (samples ${rule4Result.start + 1}-${rule4Result.end + 1})`
              }]);
            }
            if (_custom) {
              const beyondIdx = plotData.map((v, i) => (v > ucl || v < lcl) ? (i + 1) : null).filter((x) => x !== null);
              if (beyondIdx.length > 0) {
                setViolations((prev) => [...prev, { message: `${beyondIdx.length} point(s) beyond control limits (samples ${beyondIdx.join(', ')}). Investigate special causes.` }]);
              }
            }
            
            if (chartRef.current) {
              const ctx = chartRef.current.getContext('2d');
              
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
              
              chartInstance.current = new Chart(ctx, {
                type: 'line',
                data: {
                  labels: Array.from({length: plotData.length}, (_, i) => i + 1),
                  datasets: [{
                    label: 'Measurement',
                    data: plotData,
                    borderColor: '#0f766e',
                    backgroundColor: 'rgba(15, 118, 110, 0.08)',
                    borderWidth: 2,
                    pointRadius: 4,
                    pointBackgroundColor: '#0f766e'
                  }, {
                    label: 'UCL',
                    data: Array(plotData.length).fill(ucl),
                    borderColor: '#dc2626',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0
                  }, {
                    label: 'CL',
                    data: Array(plotData.length).fill(mean),
                    borderColor: '#0f766e',
                    borderWidth: 2,
                    pointRadius: 0
                  }, {
                    label: 'LCL',
                    data: Array(plotData.length).fill(lcl),
                    borderColor: '#dc2626',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: {
                      labels: { color: '#0f172a', font: { size: 12 } }
                    }
                  },
                  scales: {
                    y: {
                      ticks: { color: '#64748b' },
                      grid: { color: 'rgba(100, 116, 139, 0.15)' }
                    },
                    x: {
                      ticks: { color: '#64748b' },
                      grid: { color: 'rgba(100, 116, 139, 0.15)' },
                      title: { display: true, text: 'Sample Number', color: '#64748b' }
                    }
                  }
                }
              });
            }
            
            return () => {
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
            };
          }, [series]);

          if (series === null) {
            return (
              <div style={{ padding: '2.5rem 1rem', textAlign: 'center', color: '#64748b', background: '#f8fafc', borderRadius: '0.5rem', border: '1px dashed #e2e8f0' }}>
                📉 Enter at least 5 process measurements above (comma-separated numbers, e.g. &quot;85, 82, 88, 82, 81&quot;) to run SPC analysis.
              </div>
            );
          }

          const exportChart = () => {
            if (chartRef.current) {
              const url = chartRef.current.toDataURL('image/png');
              const a = document.createElement('a');
              a.href = url;
              a.download = 'control-chart.png';
              a.click();
            }
          };
          
          return (
            <div>
              <div style={{ height: '300px', marginBottom: '1rem' }}>
                <canvas ref={chartRef}></canvas>
              </div>
              {violations.map((v, i) => (
                <div key={i} style={{ padding: '1rem', background: 'rgba(220, 38, 38, 0.05)', borderRadius: '0.5rem', marginBottom: '1rem' }}>
                  <p style={{ color: '#dc2626', fontSize: '0.875rem', fontWeight: '600' }}>⚠️ {v.message}</p>
                </div>
              ))}
              <div style={{ textAlign: 'center' }}>
                <button onClick={exportChart} style={{ padding: '0.5rem 1rem', background: 'rgba(15, 118, 110, 0.12)', color: '#0f766e', border: '1px solid #0f766e', borderRadius: '0.25rem', fontSize: '0.875rem', cursor: 'pointer' }}>
                  📥 Export Chart PNG
                </button>
              </div>
            </div>
          );
        }

        // Capability Analysis Chart
        function CapabilityChart({ cpk = 0.89, single = false }) {
          const chartRef = useRef(null);
          const chartInstance = useRef(null);
          
          useEffect(() => {
            if (chartRef.current) {
              const ctx = chartRef.current.getContext('2d');
              
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
              
              const cp = 1.45;
              const ppk = 0.89;
              const pp = 1.45;
              
              chartInstance.current = new Chart(ctx, {
                type: 'bar',
                data: {
                  labels: single ? ['Cpk'] : ['Cp', 'Cpk', 'Pp', 'Ppk'],
                  datasets: [{
                    label: 'Capability Index',
                    data: single ? [cpk] : [cp, cpk, pp, ppk],
                    backgroundColor: single ? [cpk >= 1.33 ? 'rgba(21, 128, 61, 0.75)' : 'rgba(220, 38, 38, 0.75)'] : [
                      cp >= 1.33 ? 'rgba(21, 128, 61, 0.75)' : 'rgba(220, 38, 38, 0.75)',
                      cpk >= 1.33 ? 'rgba(21, 128, 61, 0.75)' : 'rgba(220, 38, 38, 0.75)',
                      pp >= 1.33 ? 'rgba(21, 128, 61, 0.75)' : 'rgba(220, 38, 38, 0.75)',
                      ppk >= 1.33 ? 'rgba(21, 128, 61, 0.75)' : 'rgba(220, 38, 38, 0.75)'
                    ],
                    borderColor: single ? [cpk >= 1.33 ? '#15803d' : '#dc2626'] : [
                      cp >= 1.33 ? '#15803d' : '#dc2626',
                      cpk >= 1.33 ? '#15803d' : '#dc2626',
                      pp >= 1.33 ? '#15803d' : '#dc2626',
                      ppk >= 1.33 ? '#15803d' : '#dc2626'
                    ],
                    borderWidth: 2
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: { display: false }
                  },
                  scales: {
                    y: {
                      beginAtZero: true,
                      max: 2,
                      ticks: { color: '#64748b' },
                      grid: { color: 'rgba(100, 116, 139, 0.15)' }
                    },
                    x: {
                      ticks: { color: '#64748b' },

          (text || '').split('\n').forEach((rawLine) => {
            const line = rawLine.replace(/^\s*[-•*]\s*/, '');
            const m = line.match(/^\s*([^:,\-\d][^:,]*?)\s*[:,\-]\s*(\d+(?:\.\d+)?)\s*%?(?=[\s.,;]|$)/);
            if (m) {
              const name = m[1].trim();
              if (/^(yield|cpk|dpmo|samples?|\bn\b)/i.test(name)) return;
              if (name.length > 60 || name.length < 2) return;
              items.push({ issue: name, count: parseFloat(m[2]) });
            }
          });
          const total = items.reduce((a, b) => a + b.count, 0);
          let cum = 0;
          return items.sort((a, b) => b.count - a.count).map((it) => {
            const pct = total > 0 ? (it.count / total) * 100 : 0;
            cum += pct;
            return { issue: it.issue, count: it.count, percentage: pct.toFixed(1) + '%', cumulativePercentage: cum.toFixed(1) + '%' };
          });
        };

            if (t && /\d/.test(t) && /^[-+\d\s,;.*eE]+$/.test(t)) {
              const found = t.match(/-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?/g);
              if (found) found.forEach((n) => nums.push(parseFloat(n)));
            }
          });
          return nums;
        };

                            For comprehensive AI-powered analysis: mukundvijay@gmail.com
                          </div>
                        </div>
                      </>
                    )}
                  </div>
                  
                  {/* NEW: Real-Time Recommendations Sidebar (only in custom form mode) */}
                  {!useDemo && !showReport && (
                    <div style={{ position: 'sticky', top: '2rem', height: 'fit-content' }}>
                      <div style={{ background: '#ffffff', border: '1px solid #e2e8f0', borderRadius: '1rem', padding: '1.5rem' }}>
                        <h3 style={{ fontSize: '1.125rem', fontWeight: 'bold', color: '#0f766e', marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                          <span>💡</span> Real-Time Insights
                        </h3>
                        
                        {recommendations.length === 0 ? (
                          <div style={{ textAlign: 'center', padding: '2rem', color: '#64748b' }}>
                            <div style={{ fontSize: '2rem', marginBottom: '0.5rem' }}>✅</div>
                            <p style={{ fontSize: '0.875rem' }}>Enter quality data to receive intelligent recommendations</p>
                          </div>
                        ) : (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                            {recommendations.map((rec, i) => (
                              <div
                                key={i}
                                style={{
                                  padding: '1rem',
                                  background: rec.type === 'critical' ? 'rgba(220, 38, 38, 0.06)' : rec.type === 'warning' ? 'rgba(180, 83, 9, 0.06)' : 'rgba(15, 118, 110, 0.06)',
                                  border: `1px solid ${rec.type === 'critical' ? '#dc2626' : rec.type === 'warning' ? '#b45309' : '#0f766e'}`,
                                  borderRadius: '0.5rem'
                                }}
                              >
                                <div style={{ display: 'flex', alignItems: 'start', gap: '0.5rem', marginBottom: '0.5rem' }}>
                                  <span style={{ fontSize: '1.25rem' }}>
                                    {rec.type === 'critical' ? '🔴' : rec.type === 'warning' ? '⚠️' : 'ℹ️'}
                                  </span>
                                  <div>
                                    <div style={{ fontWeight: '600', color: rec.type === 'critical' ? '#dc2626' : rec.type === 'warning' ? '#b45309' : '#0f766e', fontSize: '0.875rem', marginBottom: '0.25rem' }}>
                                      {rec.title}
                                    </div>
                                    <div style={{ fontSize: '0.75rem', color: '#475569', marginBottom: '0.5rem' }}>
                                      {rec.message}
                                    </div>
                                    <div style={{ fontSize: '0.75rem', color: '#0f766e', fontWeight: '600' }}>
                                      → {rec.action}
                                    </div>
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<QualityAnalyzerToggle />, document.getElementById('root'));
    </script>
</body>
</html>
